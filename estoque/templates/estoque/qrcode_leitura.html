{% extends 'base/base_dashboard.html' %}
{% block title %}Ler QR Code{% endblock %}

{% block content %}
<div class="container my-4">
  <h4><i class="bi bi-qr-code-scan"></i> Leitura de QR Code</h4>
  <p class="text-muted">Aponte a câmera para o QR Code do equipamento para visualizar os dados.</p>

  <div id="reader" style="width: 100%; max-width: 400px;" class="mx-auto my-3"></div>

  <div class="text-center" id="status" style="font-weight: bold;"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function onScanSuccess(decodedText, decodedResult) {
    const status = document.getElementById("status");
    if (!decodedText) return;
    try {
      const destination = new URL(decodedText, window.location.origin);
      const allowedPath = /^\/estoque\/dashboard\/equipamentos\/detalhe_equipamento\/\d+\/?$/;
      if (destination.origin !== window.location.origin || !allowedPath.test(destination.pathname)) {
        status.innerText = "QR Code recusado: o endereço não pertence a um equipamento do LOGGERAL.";
        status.className = "text-danger text-center";
        return;
      }
      status.innerText = "QR Code reconhecido! Redirecionando...";
      status.className = "text-success text-center";
      window.location.assign(destination.href);
    } catch (error) {
      status.innerText = "QR Code inválido.";
      status.className = "text-danger text-center";
    }
  }

  function onScanFailure(error) {
    // Erros normais de leitura, não exibir
  }

  const html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    },
    false
  );

  html5QrcodeScanner.render(onScanSuccess, onScanFailure);

  if (!window.isSecureContext && !["localhost", "127.0.0.1"].includes(window.location.hostname)) {
    const status = document.getElementById("status");
    status.innerText = "A câmera pode ser bloqueada pelo navegador em HTTP. Solicite HTTPS à TI.";
    status.className = "text-warning text-center";
  }
</script>
{% endblock %}
