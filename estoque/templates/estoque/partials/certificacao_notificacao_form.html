<form method="post" class="notification-form">
  {% csrf_token %}
  <input type="hidden" name="acao" value="salvar_notificacao">
  <input type="hidden" name="certificado_id" value="{{ cert.pk }}">
  <label class="form-check form-switch">
    <input class="form-check-input notification-toggle" type="checkbox" role="switch"
           name="notificar_por_email" {% if cert.notificar_por_email %}checked{% endif %}>
    <span class="form-check-label">Avisar 3 meses antes</span>
  </label>
  <div class="notification-fields">
    <textarea name="email_notificacao" class="form-control form-control-sm" rows="2"
              aria-label="E-mails para aviso" placeholder="email1@empresa.com; email2@empresa.com">{{ cert.email_notificacao|default:request.user.email }}</textarea>
    <button type="submit" class="btn btn-sm btn-outline-primary" title="Salvar aviso">
      <i class="bi bi-floppy"></i><span class="visually-hidden">Salvar aviso</span>
    </button>
  </div>
  <small class="form-text">Separe os destinatários por ponto e vírgula, vírgula ou linha.</small>
  {% if cert.notificacao_enviada_em and cert.vencimento_notificado == cert.data_vencimento %}
  <small class="notification-sent"><i class="bi bi-check2-circle"></i> Enviado em {{ cert.notificacao_enviada_em|date:'d/m/Y H:i' }}</small>
  {% endif %}
</form>
