{% extends "base/base_dashboard.html" %} {% load static %} {% block content %}
<div class="container mt-4 text-center">
  <h2>Pesquisa de Navios</h2>
  <br>
  <!-- Campo de busca -->
  <div class="row g-2 mb-4 text-start">
    <div class="col-lg-6"><label class="form-label" for="searchInput">Navio, peça, agência, armador ou mês</label><input type="text" id="searchInput" placeholder="Ex.: janeiro de 2026" class="form-control" /></div>
    <div class="col-sm-6 col-lg-3"><label class="form-label" for="dateStart">Data inicial</label><input type="date" id="dateStart" class="form-control" /></div>
    <div class="col-sm-6 col-lg-3"><label class="form-label" for="dateEnd">Data final</label><input type="date" id="dateEnd" class="form-control" /></div>
  </div>

  <!-- Resultados -->
  <div id="resultados" class="row"></div>
  <button id="loadMore" type="button" class="btn btn-outline-primary mb-4" hidden>Carregar mais resultados</button>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("searchInput");
    const resultadosDiv = document.getElementById("resultados");
    const loadMore = document.getElementById("loadMore");
    const dateStart = document.getElementById("dateStart");
    const dateEnd = document.getElementById("dateEnd");
    let currentQuery = "";
    let currentPage = 1;

    async function fetchResultados(query, page = 1, append = false) {
      try {
        const params = new URLSearchParams({ q: query, page: String(page) });
        if (dateStart.value) params.set("data_inicio", dateStart.value);
        if (dateEnd.value) params.set("data_fim", dateEnd.value);
        const response = await fetch(`/pesquisar_midias/?${params.toString()}`, {
          headers: { "Accept": "application/json" }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderResultados(data.resultados, append);
        currentQuery = query;
        currentPage = data.paginacao.pagina;
        loadMore.hidden = !data.paginacao.tem_proxima;
      } catch (error) {
        resultadosDiv.replaceChildren();
        const aviso = document.createElement("p");
        aviso.className = "text-danger";
        aviso.textContent = "Não foi possível consultar as mídias. Tente novamente.";
        resultadosDiv.appendChild(aviso);
      }
    }

    function textElement(tag, text, className = "") {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function appendDetail(container, label, value) {
      const line = document.createElement("div");
      line.appendChild(textElement("strong", `${label}: `));
      line.appendChild(document.createTextNode(value || "---"));
      container.appendChild(line);
    }

    function actionLink(label, variant, url) {
      const link = textElement("a", label, `btn btn-sm btn-${variant}`);
      link.href = url;
      return link;
    }

    function renderResultados(resultados, append = false) {
      if (!append) resultadosDiv.replaceChildren();

      if (resultados.length === 0) {
        if (!append) resultadosDiv.appendChild(textElement("p", "Nenhum resultado encontrado."));
        return;
      }

      resultados.forEach((midia) => {
        const col = document.createElement("div");
        col.className = "col-md-4 mb-4";
        const card = document.createElement("div");
        card.className = "card h-100 shadow-sm";

        if (midia.is_image || midia.is_video) {
          const preview = document.createElement(midia.is_image ? "img" : "video");
          preview.src = midia.arquivo;
          preview.className = "card-img-top img-fluid";
          preview.style.maxHeight = "200px";
          preview.style.objectFit = "cover";
          if (midia.is_video) preview.controls = true;
          if (midia.is_image) preview.alt = midia.tipo_peca || `Mídia do navio ${midia.navio || "não informado"}`;
          card.appendChild(preview);
        } else {
          card.appendChild(textElement("div", "Navio sem imagem de prévia", "p-5 text-center text-muted bg-light"));
        }

        const body = document.createElement("div");
        body.className = "card-body";
        body.appendChild(textElement("h5", midia.tipo_peca || "Sem descrição", "card-title"));
        const details = document.createElement("div");
        details.className = "card-text";
        appendDetail(details, "Navio", midia.navio);
        appendDetail(details, "Agência", midia.agencia);
        appendDetail(details, "Armador", midia.armador);
        appendDetail(details, "Início", midia.inicio);
        appendDetail(details, "Fim", midia.fim);
        appendDetail(details, "Cadastrado por", midia.cadastrado_por);
        details.appendChild(textElement("span", midia.perfil_cadastro || "---", "badge text-bg-secondary mt-1"));
        body.appendChild(details);
        card.appendChild(body);

        const footer = document.createElement("div");
        footer.className = "card-footer d-flex gap-2 flex-wrap";
        if (midia.view_url) footer.appendChild(actionLink("Visualizar", "info", midia.view_url));
        if (midia.can_edit) footer.appendChild(actionLink("Editar", "warning", midia.edit_url));
        if (midia.can_delete) footer.appendChild(actionLink("Excluir navio", "danger", midia.delete_url));
        card.appendChild(footer);
        col.appendChild(card);
        resultadosDiv.appendChild(col);
      });
    }

    // Evento de digitação com delay
    let timeout = null;
    searchInput.addEventListener("input", function () {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        const query = searchInput.value.trim();
        fetchResultados(query);
      }, 300);
    });

    [dateStart, dateEnd].forEach((field) => field.addEventListener("change", function () {
      fetchResultados(searchInput.value.trim());
    }));

    loadMore.addEventListener("click", function () {
      fetchResultados(currentQuery, currentPage + 1, true);
    });

    fetchResultados("");
  });
</script>
{% endblock %}
